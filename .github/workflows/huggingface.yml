# Deploys OnPaper to a free Hugging Face Space and keeps it alive.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN      a Hugging Face *write* token (huggingface.co/settings/tokens)
#   secret   GROQ_API_KEY  (optional) enables the AI features on the Space
#   variable HF_SPACE      e.g. "your-hf-username/onpaper"
name: Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # every 6h: wake/restart the Space if it slept or crashed

concurrency: hf-space

jobs:
  test:  # a failing test blocks the deploy, so a broken build never reaches the live site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -q -r requirements.txt pytest
      - run: python -m nltk.downloader -q punkt_tab punkt stopwords
      - run: python -m pytest -q tests/ -p no:warnings

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q "huggingface_hub>=0.25"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api, repo = HfApi(token=os.environ["HF_TOKEN"]), os.environ["HF_SPACE"]
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)
          if os.environ.get("GROQ_API_KEY"):
              api.add_space_secret(repo, "GROQ_API_KEY", os.environ["GROQ_API_KEY"])
          # A Space reads its config from README front matter; prepend it to the
          # checkout's README (this copy only, the GitHub README is untouched).
          body = open("README.md", encoding="utf-8").read()
          open("README.md", "w", encoding="utf-8").write(
              "---\ntitle: OnPaper\nemoji: 📜\ncolorFrom: red\ncolorTo: yellow\n"
              "sdk: docker\napp_port: 7860\npinned: true\n---\n\n" + body)
          api.upload_folder(folder_path=".", repo_id=repo, repo_type="space",
                            ignore_patterns=[".git/**", ".github/**", ".devcontainer/**", "**/__pycache__/**"],
                            delete_patterns=["**"],  # mirror: drop files deleted on GitHub
                            commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}")
          print("Deployed:", f"https://huggingface.co/spaces/{repo}")
          EOF

  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q "huggingface_hub>=0.25"
      - name: Wake or restart the Space if needed, then ping it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'EOF'
          import os, time, urllib.request
          from huggingface_hub import HfApi
          api, repo = HfApi(token=os.environ["HF_TOKEN"]), os.environ["HF_SPACE"]
          stage = api.get_space_runtime(repo).stage
          print("Space stage:", stage)
          if stage in ("SLEEPING", "PAUSED", "STOPPED", "RUNTIME_ERROR", "BUILD_ERROR"):
              api.restart_space(repo)
              print("Restart requested")
              for _ in range(30):  # wait up to ~10 min for it to come up
                  time.sleep(20)
                  stage = api.get_space_runtime(repo).stage
                  if stage == "RUNNING":
                      break
          host = getattr(api.space_info(repo), "host", None) or \
              "https://" + repo.replace("/", "-").replace("_", "-").replace(".", "-").lower() + ".hf.space"
          with urllib.request.urlopen(host + "/_stcore/health", timeout=60) as r:
              print("Health:", r.status, r.read().decode())
          EOF
