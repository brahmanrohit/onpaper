# Local-dev config (used by `python run.py`, which cd's into main/).
# The cloud deploy reads the repo-root ../.streamlit/config.toml instead.
[server]
headless = true
port = 8501
maxUploadSize = 10          # MB — keep in sync with the root .streamlit/config.toml

[browser]
gatherUsageStats = false

[theme]
# Warm paper + ink. Keep in sync between both config.toml files.
base = "light"
primaryColor = "#A04428"
backgroundColor = "#FFFDF9"
secondaryBackgroundColor = "#F5EEE4"
textColor = "#2A2420"
font = "sans serif"
